<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ronald’s Batch Label Designer</title>
<style>body{margin:0;background:#f5f3ef;color:#333;font:16px/1.5 system-ui,sans-serif}main{max-width:560px;margin:12vh auto;padding:24px}h1{font-size:26px}button{font:inherit;padding:10px 18px;border:0;border-radius:8px;background:#315b48;color:white;cursor:pointer}.hint{font-size:14px;color:#666}</style></head>
<body><main><h1>Ronald’s Batch Label Designer</h1><p>Labels on your Mac or iPhone.</p><button id="openDesigner">Open Batch Designer</button><p class="hint" id="launcherStatus" role="status">Loading the current designer…</p><p class="hint">Saved batches stay in this browser on this device. Use Export and Import to move them between browsers or from Glazy.</p></main>
<script>
const button=document.getElementById('openDesigner'),status=document.getElementById('launcherStatus');
function openDesigner(){button.disabled=true;status.textContent='Loading the current designer…';const script=document.createElement('script');script.src='https://ronaldboersen.github.io/glazy-tools-dist/rb-batch-label-designer-loader-v1.js';script.onload=()=>{button.disabled=false;status.textContent='Use Open Batch Designer to reopen it after closing.';script.remove();};script.onerror=()=>{button.disabled=false;status.textContent='Could not load the designer. Check your internet connection and try again.';script.remove();};document.head.appendChild(script);}
button.onclick=openDesigner;openDesigner();
</script></body></html>
