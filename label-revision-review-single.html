* { box-sizing: border-box; }
.shade { position: fixed; inset: 0; z-index: 2147483600; background: #0007; padding: 20px; overflow: auto; }
.panel { width: 100%; min-width: 0; max-width: 1020px; margin: auto; background: #f3f3f3; border: 1px solid #ccc; border-radius: 12px; box-shadow: 0 10px 50px #0003; padding: 22px; }
header { display: flex; align-items: center; gap: 8px; min-height: 64px; background: #f4f4f4; border-bottom: 1px solid #e4e4e4; padding: 12px 17px; margin: -22px -22px 16px; border-radius: 11px 11px 0 0; }
h1 { color: #777; font-size: 19px; line-height: 1.2; font-weight: 650; letter-spacing: -.2px; margin: 0; flex: 1; min-width: 0; }
h2 { font-size: 18px; margin: 0 0 6px; overflow-wrap: anywhere; }
h3 { font-size: 16px; line-height: 1.4; font-weight: 600; margin: 0 0 12px; }
p { margin: 8px 0; }
.layout { display: grid; grid-template-columns: minmax(280px,1fr) minmax(280px,1fr); gap: 24px; }
.section { background: #fff; border: 2px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.dimensions { --section-accent: #e65100; border-color: var(--section-accent); }
.fields { --section-accent: #6a1b9a; border-color: var(--section-accent); }
.printing { --section-accent: #1b5e20; border-color: var(--section-accent); }
.grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.layout > *, .grid > *, .checks > * { min-width: 0; }
label { display: block; font-weight: 500; }
input, select, button { font: inherit; color: inherit; }
input:not([type=checkbox]):not([type=range]), select { display: block; width: 100%; min-width: 0; min-height: 42px; padding: 7px 9px; border: 1px solid #bbb; border-radius: 5px; background: #fff; margin-top: 4px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--section-accent, #aaa); margin: 0; flex: none; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
.check { display: flex; gap: 9px; align-items: center; font-weight: 400; }
.date-settings { border-top: 1px solid #ddd; margin-top: 12px; padding-top: 12px; }
.hint { font-size: 13px; color: #666; }
.date-confirm { margin-top: 10px; font-size: 13px; }
button { cursor: pointer; border: 1px solid #bbb; background: #f5f5f5; padding: 9px 13px; border-radius: 6px; min-height: 42px; }
button:hover { background: #eaeaea; }
button.primary { background: #1b5e20; color: #fff; border-color: #1b5e20; font-weight: 600; }
button.primary:hover { background: #1b5e20; }
button:disabled, input:disabled, select:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--section-accent, #0d47a1); outline-offset: 2px; }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.preview-section { background: #fff; border: 2px solid #888; margin-bottom: 14px; border-radius: 8px; padding: 18px; text-align: center; }
.preview-stock { background: #fff; margin: 12px auto; padding: 0; max-width: 100%; box-shadow: 0 2px 10px #0002; border-radius: 6px; overflow: hidden; }
canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.warning { color: #b71c1c; font-size: 14px; text-align: left; }
.warning p { margin: 6px 0; }
.status { border-radius: 5px; padding: 10px; background: #f3f3f3; white-space: pre-line; }
.status.error { background: #f3f3f3; color: #b71c1c; }
.status:empty { display: none; }
.printer-status { margin: 8px 0; font-size: 14px; }
.total { font-weight: 600; color: #1b5e20; }
details { margin-top: 14px; }
summary { cursor: pointer; font-weight: 500; }
.presets { --section-accent: #0d47a1; border-color: var(--section-accent); }
.support { color: #0d47a1; border-top: 1px solid #ddd; padding-top: 14px; }
.support a { color: #0d47a1; }
.support iframe { width: 100%; height: 280px; border: 0; margin-top: 12px; }
.hidden, [hidden] { display: none !important; }
.recipe-summary { margin-bottom: 16px; }
.general-status { margin-bottom: 16px; background: #fff; border: 2px solid #ddd; }
.recipe-selection { margin-top: 14px; padding: 12px; border: 2px solid #aaa; border-radius: 8px; background: #fff; }
.selection-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.selection-toolbar .buttons { margin: 0; }
.recipe-list { max-height: 204px; overflow-y: auto; margin-top: 10px; }
.recipe-row { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.recipe-row button { padding: 4px 8px; min-height: 32px; flex: 1; min-width: 0; text-align: left; background: #fff; border-color: transparent; overflow-wrap: anywhere; }
.recipe-row button[aria-current=true] { background: #f1f1f1; border-color: #999; }
.recipe-row input { margin-left: 2px; }
.carousel-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
.carousel { position: relative; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; min-width: 0; }
.label-slide { flex: 0 0 100%; min-width: 0; padding: 8px 2px; scroll-snap-align: start; }
.label-slide h4 { margin: 8px 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.slide-inclusion { justify-content: center; margin: 12px 0; }
@media(max-width:720px) { .shade { padding: 8px; } .panel { padding: 15px; } .layout { grid-template-columns: minmax(0,1fr); gap: 14px; } header { margin: -15px -15px 16px; } .preview-section { padding: 12px; } }


.scope-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
.scope-toolbar .buttons { margin:0; }
[data-recipe-scope][aria-pressed=true] { background:#e4e4e4; border:2px solid #777; padding:8px 12px; }
.emblem-settings input[type=file] { font-size:13px; }
.connection-status { margin-top:12px; }

.darkness-control { min-width:0; }
.darkness-slider { position: relative; }
input[type=range] { display:block; width:100%; min-width:0; height:42px; margin:0; padding:0; border:0; background:transparent; appearance:none; -webkit-appearance:none; cursor:pointer; }
input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:#aaa; }
input[type=range]::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; box-sizing:border-box; width:20px; height:20px; margin-top:-8px; border:1px solid #666; border-radius:50%; background:#777; }
input[type=range]::-moz-range-track { height:4px; border-radius:2px; background:#aaa; }
input[type=range]::-moz-range-thumb { box-sizing:border-box; width:20px; height:20px; border:1px solid #666; border-radius:50%; background:#777; }
.darkness-default { position:absolute; left:calc(64.285714% - 2.857143px); top:32px; width:2px; height:6px; background:#888; transform:translateX(-50%); pointer-events:none; }
.darkness-scale { display:flex; justify-content:space-between; color:#666; font-size:13px; }

.technical-help { border-top:1px solid #ddd; padding-top:12px; color:#555; font-size:13px; }
.technical-help summary { line-height:1.4; }
.technical-content { padding-top:8px; }
.technical-content h4 { margin:12px 0 6px; font-size:14px; color:#333; }
.technical-content p { margin:6px 0 10px; }
.technical-content a { color:#0d47a1; }
.technical-content label { margin-top:10px; }

/* Ordinary control borders stay grey; interactive accents follow the section. */
.section input[type=range]::-webkit-slider-thumb { border-color: var(--section-accent); background: var(--section-accent); }
.section input[type=range]::-moz-range-thumb { border-color: var(--section-accent); background: var(--section-accent); }
.preview-section { --section-accent: #888; }
#close { width: 36px; height: 36px; flex: none; min-height: 0; padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #696969; font-size: 23px; line-height: 1; }
#close:hover { background: #f0f0f0; color: #222; }
.preset-manager { margin-top: 6px; }
.preset-manager summary { color: #666; font-size: 13px; font-weight: 400; }
/* Match Bulk Update's compact preset row and management actions. */
.preset-selector { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.preset-selector label { font-size: 13px; font-weight: 400; }
.preset-selector select { width: auto; max-width: 300px; min-height: 32px; padding: 4px 8px; margin: 0; border-radius: 6px; }
.preset-manager .buttons { margin-top: 8px; gap: 6px; }
.preset-manager button { font-size: 13px; min-height: 34px; padding: 7px 10px; }
@media(max-width:550px) { header { padding: 10px 13px; } }

/* Four interface containers; label pixels and print geometry remain renderer-owned. */
.layout { display:block; }
.controls { display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,1fr); gap:12px; align-items:start; }
.controls > .section { margin:0; padding:12px; }
.controls > .presets { grid-column:1 / -1; padding:10px 12px; }
.label-column { --section-accent:#e65100; border-color:var(--section-accent); position:sticky; top:12px; min-width:0; }
.label-column > h3,.fields > h3 { margin-bottom:10px; }
.label-column .dimensions { padding:0; margin:0; border:0; }
.label-column .preview-section { border:0; border-top:1px solid #ddd; border-radius:0; margin:12px 0 0; padding:10px 0 0; background:transparent; }
.printing { margin-top:12px; padding:12px; }
.preset-selector { flex-wrap:nowrap; }
.preset-selector label { color:#0d47a1; font-weight:600; }
.preset-selector select { flex:1; max-width:none; }
.preset-manager { margin-top:5px; }
.content-group { padding:7px 8px 8px; margin:0 0 8px; border:1px solid #ddd; border-radius:6px; background:#f5f5f5; min-width:0; }
.content-group:last-child { margin-bottom:0; }
.content-group legend { padding:0 4px; font-weight:500; font-size:13px; }
.content-group .checks { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); gap:2px 8px; margin:0; }
.content-group .check { gap:7px; min-height:30px; flex-wrap:wrap; align-content:center; font-size:14px; white-space:nowrap; }
.field-fit { flex-basis:100%; padding-left:25px; color:#666; font-size:11px; line-height:1.2; white-space:normal; }
.fit-issue { color:#666; }
.content-group .emblem-settings { margin-top:4px; font-size:13px; }
.date-settings { margin-top:4px; padding-top:6px; border-top:1px solid #ddd; }
.date-settings .grid { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:6px; font-size:12px; }
.orientation-select { min-height:36px; margin:0; }
.layout-settings { margin-top:6px; }
.layout-settings .grid { gap:6px; font-size:12px; margin-top:6px; }
.stock-picker { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; }
.stock-choice { font-size:11px; padding:6px 2px; background:#fff; white-space:nowrap; }
.stock-frame { display:flex; height:62px; align-items:center; justify-content:center; margin-bottom:5px; }
.stock-paper { display:block; flex:none; border:1px solid #888; border-radius:3px; background:#f3f3f3; }
.stock-choice[aria-pressed=true] { border:2px solid #e65100; padding:5px 1px; }
.stock-choice[aria-pressed=true] .stock-paper { border-color:#e65100; }
.stock-item { position:relative; min-width:0; }
.stock-item .stock-choice { width:100%; }
.stock-remove { position:absolute; right:2px; top:1px; width:24px; height:24px; min-height:24px; padding:0; border:0; background:transparent; color:#777; font-size:17px; line-height:1; }
.stock-notice { display:flex; align-items:center; gap:8px; }
.stock-notice p:empty { display:none; }
.stock-undo { padding:2px 6px; min-height:28px; font-size:12px; }
.size-editor { display:grid; grid-template-columns:minmax(0,max-content) 76px; justify-content:center; grid-template-areas:'shape height' 'width .' 'actions actions'; gap:12px 18px; align-items:center; margin-top:12px; padding:0 2px 4px; }
.size-width { grid-area:width; justify-self:center; width:76px; text-align:center; font-size:12px; }
.size-height { grid-area:height; font-size:12px; text-align:center; }
.size-editor input { text-align:center; min-height:36px; padding:5px; }
.size-illustration { grid-area:shape; position:relative; justify-self:center; }
.size-illustration::before { content:''; position:absolute; left:0; right:0; bottom:-7px; height:4px; border:1px solid #888; border-top:0; }
.size-illustration::after { content:''; position:absolute; top:0; bottom:0; right:-8px; width:4px; border:1px solid #888; border-left:0; }
.size-shape { border:1px solid #888; border-radius:5px; background:#f3f3f3; }
.size-editor .buttons { grid-area:actions; justify-content:center; margin:0; gap:6px; }
.size-editor .buttons button { min-height:34px; font-size:13px; padding:5px 9px; }
.stock-editor,.stock-editor summary,.layout-settings summary { font-size:13px; color:#666; }
.stock-editor { margin-top:8px; }
#stockStatus:empty,#identificationStatus:empty,#recipeDataStatus:empty,#emblemAccount:empty { display:none; }
.recipe-summary { margin-bottom:12px; }
.recipe-selection { margin-top:7px; padding:7px 9px; border-width:1px; }
.recipe-selection > summary { font-size:13px; }
.general-status { margin:6px 0 0; border:0; background:#f3f3f3; font-size:12px; }
.carousel { display:block; max-height:min(60vh,520px); overflow-x:hidden; overflow-y:auto; scroll-snap-type:y proximity; overscroll-behavior:contain; }
.carousel.single-recipe { max-height:none; overflow:visible; }
.label-slide { width:100%; padding:4px 2px; }
.label-slide h4 { margin:0 0 5px; color:#666; font-size:12px; }
.preview-stock { position:relative; background:#fff; padding:12px 0; margin:8px auto; border-radius:3px; overflow:visible; box-shadow:0 2px 8px #0002; }
.preview-stock::before,.preview-stock::after { content:''; position:absolute; left:0; right:0; height:9px; background:#f5f5f5; }
.preview-stock::before { top:0; border-bottom:1px solid #ddd; }
.preview-stock::after { bottom:0; border-top:1px solid #ddd; }
.carousel-controls { font-size:12px; margin-bottom:5px; }
.carousel-controls button { font-size:12px; padding:5px 9px; min-height:32px; }
.slide-inclusion { font-size:12px; margin:7px 0; }
.preview-section .warning,#layoutStatus,#layoutStatus.error { color:#666; font-size:12px; background:transparent; padding:3px; }
.preview-section .warning:empty { display:none; }
@media(max-width:720px) {
  .controls { grid-template-columns:minmax(0,1fr); gap:10px; }
  .label-column { position:static; }
  .stock-picker { display:flex; overflow-x:auto; padding:3px; margin:-3px; scroll-snap-type:x proximity; }
  .stock-item { flex:0 0 76px; scroll-snap-align:start; }
  .scope-toolbar .buttons { gap:5px; }
  .scope-toolbar button { font-size:12px; padding:6px 8px; }
  .printing { margin-top:10px; }
}

/* Continuous stock carrier. Rounded labels and side selectors are UI-only. */
.carousel-controls { display:none; }
.carousel { max-height:min(60vh,520px); overflow-y:auto; overflow-x:hidden; scroll-snap-type:y proximity; }
.ribbon-track { position:relative; display:flex; flex-direction:column; align-items:center; gap:12px; width:max-content; max-width:100%; margin:auto; padding:14px 32px 14px 0; }
.ribbon-track::before { content:''; position:absolute; inset:0 32px 0 0; border-radius:3px; background:#eee; }
.ribbon-track .label-slide { position:relative; flex:none; max-width:100%; padding:0; margin:0; scroll-snap-align:start; }
.ribbon-track .preview-stock { width:100%; margin:0; padding:0; border-radius:6px; overflow:hidden; background:#fff; box-shadow:0 1px 5px #0002; }
.ribbon-track .preview-stock canvas { border-radius:6px; }
.ribbon-track .preview-stock::before,.ribbon-track .preview-stock::after { display:none; }
.ribbon-track .slide-inclusion { position:absolute; right:-28px; top:50%; transform:translateY(-50%); margin:0; padding:3px; width:24px; height:24px; }
.ribbon-track h4 { padding:3px 2px; margin:0; font-size:11px; }
.ribbon-track.has-references { padding-left:92px; }
.ribbon-track.has-references::before { left:92px; }
.ribbon-track .preview-reference { position:absolute; right:calc(100% + 8px); top:50%; transform:translateY(-50%); width:84px; max-height:calc(100% - 4px); overflow:hidden; overflow-wrap:anywhere; line-height:1.25; font-weight:500; }
.ribbon-horizontal .ribbon-track.has-references { padding-left:14px; padding-top:44px; }
.ribbon-horizontal .ribbon-track.has-references::before { left:0; top:44px; }
.ribbon-horizontal .preview-reference { right:auto; left:0; top:-40px; transform:none; width:100%; max-height:36px; text-align:center; }
.ribbon-track .warning { margin:0; font-size:11px; }
.carousel.ribbon-horizontal { overflow-x:auto; overflow-y:hidden; max-height:none; scroll-snap-type:x proximity; }
.ribbon-horizontal .ribbon-track { flex-direction:row; align-items:flex-start; padding:0 14px 32px; }
.ribbon-horizontal:not(.single-recipe) .ribbon-track { max-width:none; }
.ribbon-horizontal .ribbon-track::before { inset:0 0 32px 0; }
.ribbon-horizontal .slide-inclusion { top:auto; bottom:-28px; right:50%; transform:translateX(50%); }
.recipe-summary > h3 { margin:0 0 6px; }
.scope-toolbar [data-recipe-scope] { background:#fff; }
.scope-toolbar [data-recipe-scope][aria-pressed=true] { background:#fff; border-color:#777; box-shadow:inset 0 0 0 1px #777; }
#previewSelection { gap:5px; margin-bottom:8px; }
#previewSelection strong { font-size:12px; font-weight:500; color:#666; }
#previewSelection button { font-size:12px; padding:5px 8px; min-height:34px; }
.orientation-picker { display:flex; gap:8px; }
.orientation-choice { display:flex; align-items:center; justify-content:center; width:78px; height:62px; padding:6px; background:#fff; }
.orientation-choice[aria-pressed=true] { border:2px solid #6a1b9a; }
.orientation-paper { display:flex; align-items:center; justify-content:center; border:1px solid #888; border-radius:4px; background:#f3f3f3; }
.orientation-paper.portrait { width:28px; height:44px; }
.orientation-paper.landscape { width:44px; height:28px; }
.orientation-lines { width:60%; height:12px; border-top:1px solid #888; border-bottom:1px solid #888; position:relative; }
.orientation-lines::after { content:''; position:absolute; top:5px; left:0; width:100%; border-top:1px solid #888; }
.print-action-row { margin-top:8px; }
.print-action-row #print { width:100%; }
.printer-connection-row { display:flex; flex-wrap:nowrap; gap:8px; margin-top:8px; }
.printer-connection-row button { flex:1; min-width:0; white-space:nowrap; padding:7px 9px; font-size:13px; }

/* A centred label with neighbouring stock; the actual canvas is untouched. */
.controls { align-items:start; }
.fields { align-self:start; }
.label-column { display:flex; flex-direction:column; height:var(--workspace-height,auto); min-height:0; position:static; }
.label-column .preview-section { display:flex; flex-direction:column; flex:1; min-height:0; }
.carousel,.carousel.single-recipe { flex:1; min-height:0; max-height:none; overflow-y:auto; overflow-x:hidden; scroll-snap-type:y mandatory; }
.ribbon-track { padding-top:calc(var(--label-height,100px) + 12px); padding-bottom:calc(var(--label-height,100px) + 12px); }
.ribbon-track .label-slide { scroll-snap-align:center; }
.ribbon-track .label-slide:first-child::before,.ribbon-track .label-slide:last-child::after { content:''; position:absolute; left:0; width:var(--label-width); height:var(--label-height); background:#fff; border-radius:6px; box-shadow:0 1px 5px #0002; pointer-events:none; }
.ribbon-track .label-slide:first-child::before { bottom:calc(100% + 12px); }
.ribbon-track .label-slide:last-child::after { top:calc(100% + 12px); }
.carousel.ribbon-horizontal { overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; }
.ribbon-horizontal .ribbon-track,.ribbon-horizontal .ribbon-track.has-references { padding-left:calc(var(--label-width,100px) + 12px); padding-right:calc(var(--label-width,100px) + 12px); max-width:none; }
.ribbon-horizontal .ribbon-track.has-references::before { left:0; }
.ribbon-horizontal .label-slide:first-child::before { bottom:auto; top:0; left:auto; right:calc(100% + 12px); }
.ribbon-horizontal .label-slide:last-child::after { top:0; left:calc(100% + 12px); }
#mixingDate { max-width:100%; width:100%; min-width:0; -webkit-appearance:none; }
#mixingDate::-webkit-date-and-time-value { text-align:left; }
.printing > .grid { grid-template-columns:max-content minmax(0,1fr); align-items:start; }
#copies { width:4.5em; max-width:100%; }
@media(max-width:720px) {
  .label-column { height:auto; }
  .carousel,.carousel.single-recipe { flex:none; height:var(--focus-height,300px); max-height:510px; }
  .date-settings .grid { grid-template-columns:minmax(0,1fr); }
  .printing > .grid { grid-template-columns:max-content minmax(0,1fr); gap:12px; }
}
